server {
    server_name 112.78.15.2 crm.simoncenter.vn;
    root /var/www/crm_phong_kham;
    index index.php index.html;

    server_tokens off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block sensitive directories
    location ~ ^/(config|sessions|scripts|database|cron|Backup|_backups|tai-lieu-cau-hoi)/ {
        deny all;
        return 404;
    }

    # Block sensitive file extensions & hidden files
    location ~* \.(env|sql|sql\.gz|bak|tar|tar\.gz|gz|sh|exp|py|log|git|md)$ {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/crm.simoncenter.vn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/crm.simoncenter.vn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = crm.simoncenter.vn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name 112.78.15.2 crm.simoncenter.vn;
    return 404; # managed by Certbot
}
